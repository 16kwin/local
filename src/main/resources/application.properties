spring.application.name=local
# Порт сервера
server.port=8081

# Настройки PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/back3
spring.datasource.username=postgres
spring.datasource.password=Tuduta95
spring.datasource.driver-class-name=org.postgresql.Driver
# Автоматическое создание таблиц (Hibernate)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
logging.level.sigma.local=INFO
logging.level.org.springframework.web=WARN
spring.jpa.hibernate.ddl-auto=update
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n
spring.jackson.time-zone=Asia/Yekaterinburg
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false